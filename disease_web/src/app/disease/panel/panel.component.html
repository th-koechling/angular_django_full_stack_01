<div class="panel-container" style="width: 1400px; margin-top:25px;margin-left:20px">
    <h1 style="color: seagreen; font-weight: bold;" >Panels</h1>
    <h3 style="color: lightseagreen; font-weight: bold;" >Add, edit and view disease-associated panels</h3>

    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8" matSort>
        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
            <td mat-cell *matCellDef="let panel">{{ panel.name }}</td>
        </ng-container>
        <ng-container matColumnDef="genes">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Genes </th>
            <td mat-cell *matCellDef="let panel">{{ panel.genes }}</td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let panel; columns: displayedColumns;"></tr>
    </table>
    <br>
    <button 
        mat-flat-button 
        (click)="goToHome()" 
        style="color: white; background-color: cornflowerblue; height: 50px; width: 200px;"
        >Back to Home
        <mat-icon 
        fontIcon="door_back" 
        style="color: white; margin-left: 0px; margin-right: 10px; display: block !important;">
        </mat-icon>
    </button>
